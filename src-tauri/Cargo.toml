[package]
name = "umatrace"
version = "0.2.0"
description = "UmaTrace race library and background collector"
authors = ["UmaTrace contributors"]
edition = "2021"
default-run = "umatrace"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
flate2 = "1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
panic = "abort"

[workspace]
