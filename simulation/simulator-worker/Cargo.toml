[package]
name = "umalytics-globalsim-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pinned JSONL worker for the Umalytics observed-race validation bridge"

[dependencies]
# Staged from the already traced source commit pinned in source-lock.json.
# A path dependency prevents Cargo from contacting the unavailable upstream.
globalsim = { package = "race_engine_rs", path = "../../.cache/globalsim-traced", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
